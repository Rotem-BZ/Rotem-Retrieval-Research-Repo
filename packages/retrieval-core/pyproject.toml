[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "retrieval-core"
version = "0.1.0"
description = "Internal Hydra-driven orchestration for retrieval experiments."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Rotem-BZ" }]
keywords = ["haystack", "hydra", "retrieval", "experiment-orchestration", "nlp"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "haystack-ai>=2.30,<3",
  "hydra-core>=1.3,<2",
  "matplotlib>=3.10,<4",
  "networkx>=3.4,<4",
  "numpy>=2,<3",
  "omegaconf>=2.3,<3",
  "pyyaml>=6,<7",
  "torchmetrics>=1.7,<2",
  "tqdm>=4.66,<5",
]

[project.urls]
Repository = "https://github.com/Rotem-BZ/Rotem-Retrieval-Research-Repo"
Issues = "https://github.com/Rotem-BZ/Rotem-Retrieval-Research-Repo/issues"

[project.optional-dependencies]
dev = [
  "pandas>=2.2,<4",
  "pyperclip>=1.8,<2",
  "pytest>=8,<9",
  "retrieval-components==0.1.0",
  "ruff>=0.8,<1",
]

[project.scripts]
stage = "retrieval_core.cli:main"
prepare-beir = "retrieval_core.notebooks.prepare_beir:main"

[tool.uv]
package = true

[tool.uv.sources]
retrieval-components = { path = "../retrieval-components", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/retrieval_core", "src/hydra_plugins"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests", "../../awesome-dev-tools/tests"]
pythonpath = ["src", "../retrieval-components/src", "../../awesome-dev-tools"]
