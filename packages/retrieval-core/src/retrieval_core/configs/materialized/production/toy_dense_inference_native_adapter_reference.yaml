# @package _global_

paths:
  project_root: .
  data_dir: ./data
  raw_data_dir: ./data/raw
  interim_data_dir: ./data/interim
  processed_data_dir: ./data/processed
  artifacts_dir: ./artifacts
  runs_dir: ./artifacts/runs
  indexes_dir: ./artifacts/indexes
  input_mappings_dir: ./artifacts/input_mappings
dataset:
  name: toy
  documents_path: ./data/processed/toy/documents.jsonl
  queries_path: ./data/processed/toy/queries.jsonl
  qrels_path: ./data/processed/toy/qrels.jsonl
selections:
  index_id: toy_e5_small_v2
  input_mapping: null
  embedding_model:
    name: e5_small_v2
    artifact_name: e5_small_v2
    checkpoint: intfloat/e5-small-v2
    document_prefix: "passage: "
    query_prefix: "query: "
    normalize_embeddings: true
    similarity: cosine
    tokenizer_kwargs:
      model_max_length: 512
pipeline:
  components:
    input:
      type: retrieval_components.interfaces.stage_io.InferenceInput
    query_preprocessor:
      type: retrieval_components.preprocessing.query_text_preprocessor.QueryTextPreprocessor
      init_parameters:
        prefix: "query: "
        replace_regexes:
          \s+: " "
    query_to_string:
      type: retrieval_components.preprocessing.query_to_string.QueryToString
    query_embedder:
      type: haystack.components.embedders.sentence_transformers_text_embedder.SentenceTransformersTextEmbedder
      init_parameters:
        model: intfloat/e5-small-v2
        normalize_embeddings: true
        device:
          type: single
          device: cpu
        progress_bar: false
        tokenizer_kwargs:
          model_max_length: 512
    retriever:
      type: retrieval_components.retrieval.jsonl_embedding_retriever.JsonlEmbeddingRetriever
      init_parameters:
        index_path: ./artifacts/indexes/toy_e5_small_v2/index.jsonl
        top_k: 10
        similarity: cosine
    output:
      type: retrieval_components.interfaces.stage_io.InferenceOutput
  connections:
    - sender: input.query
      receiver: query_preprocessor.query
    - sender: input.query
      receiver: output.query
    - sender: input.candidate_document_ids
      receiver: retriever.candidate_document_ids
    - sender: query_preprocessor.query
      receiver: query_to_string.query
    - sender: query_to_string.text
      receiver: query_embedder.text
    - sender: query_embedder.embedding
      receiver: retriever.query_embedding
    - sender: retriever.documents
      receiver: output.documents
  max_runs_per_component: 100
  metadata:
    description: Dense inference using QueryToString with a native Haystack text embedder.
    role: retrieve
    maturity: reference
    input_mode: index
    storage_backend: jsonl
stage:
  name: inference
  run_id: native-adapter-reference
  output_dir: ./artifacts/runs/inference/native-adapter-reference
  predictions_path: ./artifacts/runs/inference/native-adapter-reference/predictions.json
runtime:
  progress_bar: false
  device:
    type: single
    device: cpu
  query_concurrency_limit: 4
  concurrency_limit: 4
  indexing_batch_size: 1024
