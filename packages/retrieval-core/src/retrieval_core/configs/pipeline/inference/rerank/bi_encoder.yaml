defaults:
  - /selections/embedding_model@_global_.selections.embedding_model: ???
  - /component/query_preprocessor@components.query_preprocessor: prefix_cleanup
  - /component/query_embedder@components.query_embedder: sentence_transformers
  - /component/document_parser@components.document_parser: identity
  - /component/document_preprocessor@components.document_prefixer: prefix_cleanup
  - /component/document_embedder@components.document_embedder: sentence_transformers
  - /component/ranker@components.ranker: embedding_similarity
  - _self_

components:
  input:
    type: retrieval_components.interfaces.inference.InferenceInput
  query_preprocessor:
    init_parameters:
      prefix: ${selections.embedding_model.query_prefix}
  query_embedder:
    init_parameters:
      model: ${selections.embedding_model.checkpoint}
      normalize_embeddings: ${selections.embedding_model.normalize_embeddings}
      tokenizer_kwargs: ${selections.embedding_model.tokenizer_kwargs}
  document_prefixer:
    init_parameters:
      prefix: ${selections.embedding_model.document_prefix}
  document_embedder:
    init_parameters:
      model: ${selections.embedding_model.checkpoint}
      normalize_embeddings: ${selections.embedding_model.normalize_embeddings}
      tokenizer_kwargs: ${selections.embedding_model.tokenizer_kwargs}
  ranker:
    init_parameters:
      similarity: ${selections.embedding_model.similarity}
  output:
    type: retrieval_components.interfaces.inference.InferenceOutput

connections:
  - sender: input.query
    receiver: query_preprocessor.query
  - sender: input.query
    receiver: output.query
  - sender: input.candidate_documents
    receiver: document_parser.documents
  - sender: document_parser.documents
    receiver: document_prefixer.documents
  - sender: query_preprocessor.query
    receiver: query_embedder.query
  - sender: document_prefixer.documents
    receiver: document_embedder.documents
  - sender: query_embedder.embedding
    receiver: ranker.query_embedding
  - sender: document_embedder.documents
    receiver: ranker.documents
  - sender: ranker.documents
    receiver: output.documents

max_runs_per_component: 100
metadata:
  description: Bi-encoder reranking over materialized inference candidate documents.
  role: rerank
  maturity: reusable
  input_mode: candidates
  requires:
    - selections.embedding_model
